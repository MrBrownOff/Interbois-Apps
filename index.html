<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications Interbois</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root {
            --noir: #000000;
            --blanc: #ffffff;
            --gris-pale: #E8E8E8;
            --gris-moyen: #CFCDCB;
            --gris-fonce: #5B5B59;
            --accent: #FE5000;
            --bw-hair: 1px;
            --bw-rule: 2px;
            --bw-heavy: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: "Geologica", system-ui, sans-serif;
            background: var(--blanc);
            color: var(--noir);
            min-height: 100vh;
            padding: 64px 24px 96px;
        }

        a {
            color: var(--noir);
        }

        a:hover {
            color: var(--accent);
        }

        header {
            max-width: 960px;
            margin: 0 auto 48px;
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gris-fonce);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .demi-rond {
            width: 8px;
            height: 4px;
            background: var(--accent);
            border-radius: 999px 999px 0 0;
        }

        h1 {
            font-family: "Geologica", sans-serif;
            font-weight: 800;
            letter-spacing: -0.03em;
            font-size: clamp(2rem, 4vw, 2.75rem);
            margin-bottom: 24px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            border-top: var(--bw-rule) solid var(--noir);
            padding-top: 24px;
        }

        #search {
            flex: 1;
            min-width: 220px;
            max-width: 420px;
            padding: 12px 16px;
            border-radius: 0;
            border: var(--bw-hair) solid var(--noir);
            background: var(--blanc);
            color: var(--noir);
            font-family: "Geologica", sans-serif;
            font-size: 1rem;
        }

        #search:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 0;
            border: var(--bw-hair) solid var(--noir);
            font-family: "Geologica", sans-serif;
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            background: var(--blanc);
            color: var(--noir);
            transition: background-color .16s ease, color .16s ease, transform .12s ease;
        }

        button:hover {
            background: var(--noir);
            color: var(--blanc);
        }

        button:active {
            transform: scale(.98);
        }

        button svg {
            width: 16px;
            height: 16px;
        }

        button.primary {
            background: var(--noir);
            color: var(--blanc);
        }

        button.primary:hover {
            background: #262626;
        }

        #adminForm {
            max-width: 960px;
            margin: 0 auto 32px;
            background: var(--blanc);
            border: var(--bw-hair) solid var(--noir);
            border-radius: 0;
            padding: 32px;
        }

        #adminForm h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        #adminForm form {
            display: grid;
            gap: 12px;
        }

        #adminForm input[type="text"],
        #adminForm input[type="url"] {
            padding: 12px;
            border-radius: 0;
            border: var(--bw-hair) solid var(--noir);
            background: var(--blanc);
            color: var(--noir);
            font-family: "Geologica", sans-serif;
            font-size: 1rem;
        }

        #adminForm input[type="text"]:focus,
        #adminForm input[type="url"]:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        #adminForm input[type="file"] {
            color: var(--gris-fonce);
            font-size: .9rem;
        }

        .form-actions {
            display: flex;
            gap: 12px;
        }

        #cancelBtn {
            border-color: var(--gris-moyen);
            color: var(--gris-fonce);
        }

        #imgPreview {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        #imgPreview img {
            width: 345px;
            height: 230px;
            object-fit: cover;
            border-radius: 0;
            border: var(--bw-hair) solid var(--noir);
        }

        /* Fenêtre de connexion */
        #loginModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #loginModal .box {
            background: var(--blanc);
            border: var(--bw-hair) solid var(--noir);
            border-radius: 0;
            padding: 32px;
            width: min(90vw, 380px);
            display: grid;
            gap: 16px;
        }

        #loginModal h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        #loginModal form {
            display: grid;
            gap: 12px;
        }

        #loginModal input {
            padding: 12px;
            border-radius: 0;
            border: var(--bw-hair) solid var(--noir);
            background: var(--blanc);
            color: var(--noir);
            font-family: "Geologica", sans-serif;
            font-size: 1rem;
        }

        #loginModal input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        #loginError {
            color: var(--accent);
            font-size: .85rem;
        }

        #grid {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            max-width: 960px;
            margin: 0 auto;
        }

        .card {
            background: var(--blanc);
            border: var(--bw-hair) solid var(--noir);
            border-radius: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color .16s ease, transform .16s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .card .screenshot {
            width: 100%;
            max-width: 345px;
            height: 230px;
            object-fit: cover;
            border-radius: 0;
            background: var(--gris-pale);
            margin-bottom: 4px;
        }

        .card .icon {
            width: 28px;
            height: 28px;
            color: var(--gris-fonce);
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .card p {
            font-family: "Lora", serif;
            font-style: italic;
            color: var(--gris-fonce);
            font-size: .9rem;
            line-height: 1.5;
            flex: 1;
        }

        .card .open-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: var(--noir);
            font-size: .9rem;
            font-weight: 600;
        }

        .card .open-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .card .admin-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 12px;
            border-top: var(--bw-hair) solid var(--gris-moyen);
        }

        .card .admin-actions button {
            padding: 6px 12px;
            font-size: .82rem;
        }

        .card .admin-actions .delete:hover {
            background: var(--accent);
            color: var(--blanc);
            border-color: var(--accent);
        }

        .empty {
            color: var(--gris-fonce);
            text-align: center;
            grid-column: 1 / -1;
            padding: 48px 0;
        }

        .hint {
            color: var(--gris-fonce);
            font-size: .85rem;
            margin-top: 8px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <div class="eyebrow"><span class="demi-rond"></span>interbois</div>
        <h1>Applications Interbois</h1>
        <div class="header-actions">
            <input id="search" type="search" placeholder="Rechercher une application…">
            <button id="adminBtn"><i data-lucide="settings"></i> Mode admin</button>
        </div>
    </header>

    <!-- Fenêtre de connexion -->
    <div id="loginModal" class="hidden">
        <div class="box">
            <h2><i data-lucide="lock"></i> Connexion admin</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="loginPass" placeholder="Mot de passe" autocomplete="current-password">
                <div class="form-actions">
                    <button type="submit" class="primary">Se connecter</button>
                    <button type="button" id="loginCancel">Annuler</button>
                </div>
            </form>
            <p id="loginError" class="hidden">Email ou mot de passe incorrect.</p>
        </div>
    </div>

    <!-- Formulaire admin -->
    <section id="adminForm" class="hidden">
        <h2 id="formTitle"><i data-lucide="plus"></i> Ajouter une application</h2>
        <form id="appForm">
            <input id="fTitre" type="text" placeholder="Titre *" required>
            <input id="fUrl" type="url" placeholder="URL (https://…) *" required>
            <input id="fIcon" type="text" placeholder="Icône Lucide (ex : rocket)">
            <input id="fDesc" type="text" placeholder="Description (optionnel)">
            <div>
                <input id="fImage" type="file" accept="image/*">
                <p class="hint">Capture d'écran : redimensionnée automatiquement en 345 × 230 px puis envoyée sur le
                    serveur.</p>
                <div id="imgPreview" class="hidden">
                    <img id="imgPreviewImg" alt="Aperçu">
                    <button type="button" id="removeImgBtn"><i data-lucide="trash-2"></i> Retirer l'image</button>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="primary"><i data-lucide="save"></i> Enregistrer</button>
                <button type="button" id="cancelBtn" class="hidden"><i data-lucide="x"></i> Annuler</button>
            </div>
        </form>
    </section>

    <main id="grid">
        <p class="empty">Chargement…</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⬇️ TES CLÉS SUPABASE (Project Settings → API)
        const SUPABASE_URL = "https://ggvjivxegniouanemgfg.supabase.co";    // ex: https://xxxx.supabase.co
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdndmppdnhlZ25pb3VhbmVtZ2ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTg4MjIsImV4cCI6MjEwMzA3NDgyMn0.dlOrUBYxYspPp_Aw149cjkWRAbEInoqvmnIz6ZmJWjg";  // clé "anon public"


        // ⚠️ Attention : "supabase" est déjà utilisé par le CDN → on nomme le client "supabaseClient"
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let apps = [];
        let adminMode = false;
        let editingId = null;
        let pendingImage = null;
        let removeImage = false;

        function refreshIcons() {
            if (window.lucide) lucide.createIcons();
        }

        // ---------- Rendu ----------
        const grid = document.getElementById("grid");
        const search = document.getElementById("search");

        function render() {
            const q = search.value.toLowerCase();
            const matches = apps.filter(a =>
                a.titre.toLowerCase().includes(q) ||
                (a.description || "").toLowerCase().includes(q)
            );

            if (!matches.length) {
                grid.innerHTML = `<p class="empty">Aucune application trouvée.</p>`;
                return;
            }

            grid.innerHTML = matches.map(a => `
            <div class="card">
              ${a.image_url
                    ? `<img class="screenshot" src="${a.image_url}" alt="${a.titre}" loading="lazy">`
                    : `<i class="icon" data-lucide="${a.icon || "link"}"></i>`}
              <h2>${a.titre}</h2>
              ${a.description ? `<p>${a.description}</p>` : ""}
              <a class="open-link" href="${a.url}" target="_blank" rel="noopener">Ouvrir <i data-lucide="arrow-up-right" style="width:14px;height:14px"></i></a>
              ${adminMode ? `
                <div class="admin-actions">
                  <button class="edit" data-action="edit" data-id="${a.id}"><i data-lucide="pencil"></i> Modifier</button>
                  <button class="delete" data-action="delete" data-id="${a.id}"><i data-lucide="trash-2"></i> Supprimer</button>
                </div>` : ""}
            </div>`).join("");
            refreshIcons();
        }

        // ---------- Chargement des données depuis Supabase ----------
        async function loadApps() {
            const { data, error } = await supabaseClient
                .from("apps")
                .select("*")
                .order("created_at", { ascending: true });
            if (error) {
                console.error(error);
                grid.innerHTML = `<p class="empty">Erreur de chargement des données.</p>`;
                return;
            }
            apps = data || [];
            render();
        }

        // ---------- Connexion / déconnexion ----------
        const loginModal = document.getElementById("loginModal");
        const loginError = document.getElementById("loginError");

        function enterAdmin() {
            adminMode = true;
            document.getElementById("adminBtn").innerHTML = '<i data-lucide="lock"></i> Se déconnecter';
            document.getElementById("adminForm").classList.remove("hidden");
            loginModal.classList.add("hidden");
            loginError.classList.add("hidden");
            render();
            refreshIcons();
        }

        function exitAdmin() {
            adminMode = false;
            document.getElementById("adminBtn").innerHTML = '<i data-lucide="settings"></i> Mode admin';
            document.getElementById("adminForm").classList.add("hidden");
            resetForm();
            render();
            refreshIcons();
        }

        document.getElementById("adminBtn").addEventListener("click", () => {
            if (adminMode) {
                supabaseClient.auth.signOut();
            } else {
                loginModal.classList.remove("hidden");
                document.getElementById("loginPass").value = "";
                loginError.classList.add("hidden");
                document.getElementById("loginEmail").focus();
            }
        });

        async function tryLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPass").value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                loginError.classList.remove("hidden");
                document.getElementById("loginPass").value = "";
                document.getElementById("loginPass").focus();
            } else {
                loginModal.classList.add("hidden");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", e => {
            e.preventDefault();
            tryLogin();
        });
        document.getElementById("loginCancel").addEventListener("click", () => loginModal.classList.add("hidden"));

        // Session restaurée automatiquement
        supabaseClient.auth.getSession().then(({ data }) => { if (data.session) enterAdmin(); });
        supabaseClient.auth.onAuthStateChange(event => {
            if (event === "SIGNED_IN") enterAdmin();
            if (event === "SIGNED_OUT") exitAdmin();
        });

        // ---------- Redimensionnement image (345 × 230, recadrage cover) ----------
        function resizeImage(file, maxW = 345, maxH = 230, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = maxW;
                        canvas.height = maxH;
                        const ctx = canvas.getContext("2d");
                        const targetRatio = maxW / maxH;
                        const srcRatio = img.width / img.height;
                        let sx = 0, sy = 0, sw = img.width, sh = img.height;
                        if (srcRatio > targetRatio) {
                            sw = img.height * targetRatio;
                            sx = (img.width - sw) / 2;
                        } else {
                            sh = img.width / targetRatio;
                            sy = (img.height - sh) / 2;
                        }
                        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, maxW, maxH);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = reject;
                    img.src = reader.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function dataUrlToBlob(dataUrl) {
            const parts = dataUrl.split(",");
            const mime = parts[0].match(/:(.*?);/)[1];
            const bin = atob(parts[1]);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return new Blob([arr], { type: mime });
        }

        async function uploadScreenshot(dataUrl) {
            const fileName = (crypto.randomUUID ? crypto.randomUUID() : Date.now()) + ".jpg";
            const { error } = await supabaseClient.storage
                .from("screenshots")
                .upload("public/" + fileName, dataUrlToBlob(dataUrl), { contentType: "image/jpeg" });
            if (error) throw error;
            return supabaseClient.storage.from("screenshots").getPublicUrl("public/" + fileName).data.publicUrl;
        }

        async function deleteScreenshot(imageUrl) {
            if (!imageUrl) return;
            const marker = "/screenshots/";
            const i = imageUrl.indexOf(marker);
            if (i < 0) return;
            const path = imageUrl.slice(i + marker.length);
            await supabaseClient.storage.from("screenshots").remove([path]);
        }

        // ---------- Aperçu image ----------
        function showPreview(src) {
            document.getElementById("imgPreview").classList.remove("hidden");
            document.getElementById("imgPreviewImg").src = src;
        }

        function hidePreview() {
            document.getElementById("imgPreview").classList.add("hidden");
            document.getElementById("imgPreviewImg").src = "";
        }

        function resetForm() {
            editingId = null;
            pendingImage = null;
            removeImage = false;
            document.getElementById("appForm").reset();
            document.getElementById("formTitle").innerHTML = '<i data-lucide="plus"></i> Ajouter une application';
            document.getElementById("cancelBtn").classList.add("hidden");
            hidePreview();
            refreshIcons();
        }

        document.getElementById("cancelBtn").addEventListener("click", resetForm);

        document.getElementById("fImage").addEventListener("change", async e => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                pendingImage = await resizeImage(file);
                removeImage = false;
                showPreview(pendingImage);
            } catch (err) {
                alert("Impossible de lire cette image.");
            }
        });

        document.getElementById("removeImgBtn").addEventListener("click", () => {
            pendingImage = null;
            removeImage = true;
            document.getElementById("fImage").value = "";
            hidePreview();
        });

        // ---------- Ajout / modification ----------
        document.getElementById("appForm").addEventListener("submit", async e => {
            e.preventDefault();
            const titre = document.getElementById("fTitre").value.trim();
            const url = document.getElementById("fUrl").value.trim();
            const icon = document.getElementById("fIcon").value.trim();
            const description = document.getElementById("fDesc").value.trim();

            try {
                let imageUrl = "";
                if (editingId) {
                    const app = apps.find(a => a.id === editingId);
                    imageUrl = removeImage ? "" : (app.image_url || "");
                }
                if (pendingImage) {
                    if (editingId && imageUrl) await deleteScreenshot(imageUrl);
                    imageUrl = await uploadScreenshot(pendingImage);
                }

                if (editingId) {
                    const { data, error } = await supabaseClient
                        .from("apps")
                        .update({ titre, url, icon, description, image_url: imageUrl })
                        .eq("id", editingId)
                        .select();
                    if (error) throw error;
                    const idx = apps.findIndex(a => a.id === editingId);
                    if (idx >= 0) apps[idx] = data[0];
                } else {
                    const { data, error } = await supabaseClient
                        .from("apps")
                        .insert([{ titre, url, icon, description, image_url: imageUrl }])
                        .select();
                    if (error) throw error;
                    apps.push(data[0]);
                }
                resetForm();
                render();
            } catch (err) {
                alert("Erreur : " + err.message);
            }
        });

        // ---------- Modifier / Supprimer ----------
        grid.addEventListener("click", e => {
            const btn = e.target.closest("button[data-action]");
            if (!btn) return;
            const id = btn.dataset.id;

            if (btn.dataset.action === "edit") {
                const app = apps.find(a => a.id === id);
                editingId = id;
                document.getElementById("fTitre").value = app.titre;
                document.getElementById("fUrl").value = app.url;
                document.getElementById("fIcon").value = app.icon || "";
                document.getElementById("fDesc").value = app.description || "";
                document.getElementById("formTitle").innerHTML = '<i data-lucide="pencil"></i> Modifier : ' + app.titre;
                document.getElementById("cancelBtn").classList.remove("hidden");
                if (app.image_url) showPreview(app.image_url);
                document.getElementById("adminForm").scrollIntoView({ behavior: "smooth" });
                refreshIcons();
            }

            if (btn.dataset.action === "delete") {
                const app = apps.find(a => a.id === id);
                if (confirm(`Supprimer « ${app ? app.titre : ""} » ?`)) {
                    (async () => {
                        await deleteScreenshot(app.image_url);
                        const { error } = await supabaseClient.from("apps").delete().eq("id", id);
                        if (error) {
                            alert("Erreur : " + error.message);
                            return;
                        }
                        apps = apps.filter(a => a.id !== id);
                        render();
                    })();
                }
            }
        });

        search.addEventListener("input", render);
        loadApps();
        refreshIcons();
    </script>
</body>

</html>
