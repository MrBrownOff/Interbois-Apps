<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes applications</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        header {
            max-width: 900px;
            margin: 0 auto 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.2rem;
        }

        .header-actions {
            display: flex;
            gap: .6rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        #search {
            width: 100%;
            max-width: 400px;
            padding: .7rem 1rem;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 1rem;
        }

        button {
            padding: .7rem 1.1rem;
            border-radius: 10px;
            border: none;
            font-size: .95rem;
            cursor: pointer;
            background: #334155;
            color: #e2e8f0;
        }

        button:hover {
            filter: brightness(1.2);
        }

        button.primary {
            background: #0ea5e9;
            color: #fff;
        }

        #adminForm {
            max-width: 900px;
            margin: 0 auto 1.5rem;
            background: #1e293b;
            border: 1px solid #0ea5e9;
            border-radius: 14px;
            padding: 1.2rem;
        }

        #adminForm h2 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        #adminForm form {
            display: grid;
            gap: .6rem;
        }

        #adminForm input[type="text"],
        #adminForm input[type="url"] {
            padding: .7rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
        }

        #adminForm input[type="file"] {
            color: #94a3b8;
            font-size: .9rem;
        }

        .form-actions {
            display: flex;
            gap: .6rem;
        }

        #cancelBtn {
            background: #ef4444;
        }

        #imgPreview {
            display: flex;
            gap: .8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        #imgPreview img {
            width: 345px;
            height: 230px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        #removeImgBtn {
            background: #ef4444;
        }

        /* Fenêtre de connexion */
        #loginModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #loginModal .box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 1.5rem;
            width: min(90vw, 360px);
            display: grid;
            gap: .8rem;
        }

        #loginModal h2 {
            font-size: 1.2rem;
        }

        #loginModal form {
            display: grid;
            gap: .8rem;
        }

        #loginModal input {
            padding: .7rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
        }

        #loginError {
            color: #ef4444;
            font-size: .85rem;
        }

        #grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: .5rem;
            transition: transform .15s, border-color .15s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
        }

        .card .screenshot {
            width: 100%;
            max-width: 345px;
            height: 230px;
            object-fit: cover;
            border-radius: 8px;
            background: #0f172a;
        }

        .card .icon {
            font-size: 2rem;
        }

        .card h2 {
            font-size: 1.1rem;
        }

        .card p {
            color: #94a3b8;
            font-size: .9rem;
            line-height: 1.4;
            flex: 1;
        }

        .card .open-link {
            text-decoration: none;
            color: #38bdf8;
            font-size: .9rem;
            font-weight: 600;
        }

        .card .open-link:hover {
            text-decoration: underline;
        }

        .card .admin-actions {
            display: flex;
            gap: .5rem;
            margin-top: .6rem;
            padding-top: .6rem;
            border-top: 1px solid #334155;
        }

        .card .admin-actions button {
            padding: .4rem .8rem;
            font-size: .85rem;
        }

        .card .admin-actions .edit {
            background: #f59e0b;
            color: #0f172a;
        }

        .card .admin-actions .delete {
            background: #ef4444;
        }

        .empty {
            color: #64748b;
            text-align: center;
            grid-column: 1 / -1;
            padding: 2rem;
        }

        .hint {
            color: #64748b;
            font-size: .85rem;
            margin-top: .8rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <h1>Applications Interbois</h1>
        <div class="header-actions">
            <input id="search" type="search" placeholder="Rechercher une application…">
            <button id="adminBtn">🛠️ Mode admin</button>
        </div>
    </header>

    <!-- Fenêtre de connexion -->
    <div id="loginModal" class="hidden">
        <div class="box">
            <h2>🔒 Connexion admin</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="loginPass" placeholder="Mot de passe" autocomplete="current-password">
                <div class="form-actions">
                    <button type="submit" class="primary">Se connecter</button>
                    <button type="button" id="loginCancel">Annuler</button>
                </div>
            </form>
            <p id="loginError" class="hidden">Email ou mot de passe incorrect.</p>
        </div>
    </div>

    <!-- Formulaire admin -->
    <section id="adminForm" class="hidden">
        <h2 id="formTitle">➕ Ajouter une application</h2>
        <form id="appForm">
            <input id="fTitre" type="text" placeholder="Titre *" required>
            <input id="fUrl" type="url" placeholder="URL (https://…) *" required>
            <input id="fIcon" type="text" placeholder="Icône (emoji, ex : 🚀)">
            <input id="fDesc" type="text" placeholder="Description (optionnel)">
            <div>
                <input id="fImage" type="file" accept="image/*">
                <p class="hint">Capture d'écran : redimensionnée automatiquement en 345 × 230 px puis envoyée sur le
                    serveur.</p>
                <div id="imgPreview" class="hidden">
                    <img id="imgPreviewImg" alt="Aperçu">
                    <button type="button" id="removeImgBtn">🗑️ Retirer l'image</button>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="primary">💾 Enregistrer</button>
                <button type="button" id="cancelBtn" class="hidden">✖ Annuler</button>
            </div>
        </form>
    </section>

    <main id="grid">
        <p class="empty">Chargement…</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⬇️ TES CLÉS SUPABASE (Project Settings → API)
        const SUPABASE_URL = "https://ggvjivxegniouanemgfg.supabase.co";    // ex: https://xxxx.supabase.co
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdndmppdnhlZ25pb3VhbmVtZ2ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTg4MjIsImV4cCI6MjEwMzA3NDgyMn0.dlOrUBYxYspPp_Aw149cjkWRAbEInoqvmnIz6ZmJWjg";  // clé "anon public"


        // ⚠️ Attention : "supabase" est déjà utilisé par le CDN → on nomme le client "supabaseClient"
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let apps = [];
        let adminMode = false;
        let editingId = null;
        let pendingImage = null;
        let removeImage = false;

        // ---------- Rendu ----------
        const grid = document.getElementById("grid");
        const search = document.getElementById("search");

        function render() {
            const q = search.value.toLowerCase();
            const matches = apps.filter(a =>
                a.titre.toLowerCase().includes(q) ||
                (a.description || "").toLowerCase().includes(q)
            );

            if (!matches.length) {
                grid.innerHTML = `<p class="empty">Aucune application trouvée.</p>`;
                return;
            }

            grid.innerHTML = matches.map(a => `
            <div class="card">
              ${a.image_url
                    ? `<img class="screenshot" src="${a.image_url}" alt="${a.titre}" loading="lazy">`
                    : `<span class="icon">${a.icon || "🔗"}</span>`}
              <h2>${a.titre}</h2>
              ${a.description ? `<p>${a.description}</p>` : ""}
              <a class="open-link" href="${a.url}" target="_blank" rel="noopener">Ouvrir ↗</a>
              ${adminMode ? `
                <div class="admin-actions">
                  <button class="edit" data-action="edit" data-id="${a.id}">✏️ Modifier</button>
                  <button class="delete" data-action="delete" data-id="${a.id}">🗑️ Supprimer</button>
                </div>` : ""}
            </div>`).join("");
        }

        // ---------- Chargement des données depuis Supabase ----------
        async function loadApps() {
            const { data, error } = await supabaseClient
                .from("apps")
                .select("*")
                .order("created_at", { ascending: true });
            if (error) {
                console.error(error);
                grid.innerHTML = `<p class="empty">Erreur de chargement des données.</p>`;
                return;
            }
            apps = data || [];
            render();
        }

        // ---------- Connexion / déconnexion ----------
        const loginModal = document.getElementById("loginModal");
        const loginError = document.getElementById("loginError");

        function enterAdmin() {
            adminMode = true;
            document.getElementById("adminBtn").textContent = "🔒 Se déconnecter";
            document.getElementById("adminForm").classList.remove("hidden");
            loginModal.classList.add("hidden");
            loginError.classList.add("hidden");
            render();
        }

        function exitAdmin() {
            adminMode = false;
            document.getElementById("adminBtn").textContent = "🛠️ Mode admin";
            document.getElementById("adminForm").classList.add("hidden");
            resetForm();
            render();
        }

        document.getElementById("adminBtn").addEventListener("click", () => {
            if (adminMode) {
                supabaseClient.auth.signOut();
            } else {
                loginModal.classList.remove("hidden");
                document.getElementById("loginPass").value = "";
                loginError.classList.add("hidden");
                document.getElementById("loginEmail").focus();
            }
        });

        async function tryLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPass").value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                loginError.classList.remove("hidden");
                document.getElementById("loginPass").value = "";
                document.getElementById("loginPass").focus();
            } else {
                loginModal.classList.add("hidden");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", e => {
            e.preventDefault();
            tryLogin();
        });
        document.getElementById("loginCancel").addEventListener("click", () => loginModal.classList.add("hidden"));

        // Session restaurée automatiquement
        supabaseClient.auth.getSession().then(({ data }) => { if (data.session) enterAdmin(); });
        supabaseClient.auth.onAuthStateChange(event => {
            if (event === "SIGNED_IN") enterAdmin();
            if (event === "SIGNED_OUT") exitAdmin();
        });

        // ---------- Redimensionnement image (345 × 230, recadrage cover) ----------
        function resizeImage(file, maxW = 345, maxH = 230, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = maxW;
                        canvas.height = maxH;
                        const ctx = canvas.getContext("2d");
                        const targetRatio = maxW / maxH;
                        const srcRatio = img.width / img.height;
                        let sx = 0, sy = 0, sw = img.width, sh = img.height;
                        if (srcRatio > targetRatio) {
                            sw = img.height * targetRatio;
                            sx = (img.width - sw) / 2;
                        } else {
                            sh = img.width / targetRatio;
                            sy = (img.height - sh) / 2;
                        }
                        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, maxW, maxH);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = reject;
                    img.src = reader.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function dataUrlToBlob(dataUrl) {
            const parts = dataUrl.split(",");
            const mime = parts[0].match(/:(.*?);/)[1];
            const bin = atob(parts[1]);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return new Blob([arr], { type: mime });
        }

        async function uploadScreenshot(dataUrl) {
            const fileName = (crypto.randomUUID ? crypto.randomUUID() : Date.now()) + ".jpg";
            const { error } = await supabaseClient.storage
                .from("screenshots")
                .upload("public/" + fileName, dataUrlToBlob(dataUrl), { contentType: "image/jpeg" });
            if (error) throw error;
            return supabaseClient.storage.from("screenshots").getPublicUrl("public/" + fileName).data.publicUrl;
        }

        async function deleteScreenshot(imageUrl) {
            if (!imageUrl) return;
            const marker = "/screenshots/";
            const i = imageUrl.indexOf(marker);
            if (i < 0) return;
            const path = imageUrl.slice(i + marker.length);
            await supabaseClient.storage.from("screenshots").remove([path]);
        }

        // ---------- Aperçu image ----------
        function showPreview(src) {
            document.getElementById("imgPreview").classList.remove("hidden");
            document.getElementById("imgPreviewImg").src = src;
        }

        function hidePreview() {
            document.getElementById("imgPreview").classList.add("hidden");
            document.getElementById("imgPreviewImg").src = "";
        }

        function resetForm() {
            editingId = null;
            pendingImage = null;
            removeImage = false;
            document.getElementById("appForm").reset();
            document.getElementById("formTitle").textContent = "➕ Ajouter une application";
            document.getElementById("cancelBtn").classList.add("hidden");
            hidePreview();
        }

        document.getElementById("cancelBtn").addEventListener("click", resetForm);

        document.getElementById("fImage").addEventListener("change", async e => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                pendingImage = await resizeImage(file);
                removeImage = false;
                showPreview(pendingImage);
            } catch (err) {
                alert("Impossible de lire cette image.");
            }
        });

        document.getElementById("removeImgBtn").addEventListener("click", () => {
            pendingImage = null;
            removeImage = true;
            document.getElementById("fImage").value = "";
            hidePreview();
        });

        // ---------- Ajout / modification ----------
        document.getElementById("appForm").addEventListener("submit", async e => {
            e.preventDefault();
            const titre = document.getElementById("fTitre").value.trim();
            const url = document.getElementById("fUrl").value.trim();
            const icon = document.getElementById("fIcon").value.trim();
            const description = document.getElementById("fDesc").value.trim();

            try {
                let imageUrl = "";
                if (editingId) {
                    const app = apps.find(a => a.id === editingId);
                    imageUrl = removeImage ? "" : (app.image_url || "");
                }
                if (pendingImage) {
                    if (editingId && imageUrl) await deleteScreenshot(imageUrl);
                    imageUrl = await uploadScreenshot(pendingImage);
                }

                if (editingId) {
                    const { data, error } = await supabaseClient
                        .from("apps")
                        .update({ titre, url, icon, description, image_url: imageUrl })
                        .eq("id", editingId)
                        .select();
                    if (error) throw error;
                    const idx = apps.findIndex(a => a.id === editingId);
                    if (idx >= 0) apps[idx] = data[0];
                } else {
                    const { data, error } = await supabaseClient
                        .from("apps")
                        .insert([{ titre, url, icon, description, image_url: imageUrl }])
                        .select();
                    if (error) throw error;
                    apps.push(data[0]);
                }
                resetForm();
                render();
            } catch (err) {
                alert("Erreur : " + err.message);
            }
        });

        // ---------- Modifier / Supprimer ----------
        grid.addEventListener("click", e => {
            const btn = e.target.closest("button[data-action]");
            if (!btn) return;
            const id = btn.dataset.id;

            if (btn.dataset.action === "edit") {
                const app = apps.find(a => a.id === id);
                editingId = id;
                document.getElementById("fTitre").value = app.titre;
                document.getElementById("fUrl").value = app.url;
                document.getElementById("fIcon").value = app.icon || "";
                document.getElementById("fDesc").value = app.description || "";
                document.getElementById("formTitle").textContent = "✏️ Modifier : " + app.titre;
                document.getElementById("cancelBtn").classList.remove("hidden");
                if (app.image_url) showPreview(app.image_url);
                document.getElementById("adminForm").scrollIntoView({ behavior: "smooth" });
            }

            if (btn.dataset.action === "delete") {
                const app = apps.find(a => a.id === id);
                if (confirm(`Supprimer « ${app ? app.titre : ""} » ?`)) {
                    (async () => {
                        await deleteScreenshot(app.image_url);
                        const { error } = await supabaseClient.from("apps").delete().eq("id", id);
                        if (error) {
                            alert("Erreur : " + error.message);
                            return;
                        }
                        apps = apps.filter(a => a.id !== id);
                        render();
                    })();
                }
            }
        });

        search.addEventListener("input", render);
        loadApps();
    </script>
</body>

</html>
